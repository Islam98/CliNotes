services:
  - type: web
    name: clinotes-test-page
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run test-server
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SONIOX_API_KEY
        sync: false
      - key: TEST_APP_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
