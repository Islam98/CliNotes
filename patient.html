<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CliNotes - Patient Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/patient.css" />
</head>
<body class="patient-body">
  <nav class="top-bar">
    <div class="top-bar-left">
      <div class="app-logo">CliNotes</div>
    </div>
    <div class="top-bar-center">
      <a href="#" class="nav-link active" data-i18n="dashboard">Dashboard</a>
      <a href="/patient-records.html" class="nav-link" id="recordsNavLink" data-i18n="myRecords">My Records</a>
    </div>
    <div class="top-bar-right">
      <div class="settings-btn"><i class="uil uil-setting"></i></div>
      <div class="profile-avatar"></div>
    </div>
  </nav>

  <main class="dashboard-container">
    <section class="welcome-section">
      <div class="welcome-left">
        <h1 class="greeting">Loading...</h1>
        <p class="subtext" data-i18n="patientDashboardSubtitle">Here’s a summary of your recent health activity</p>
      </div>
      <div class="welcome-right">
        <button class="patient-card-btn" id="viewPatientCardBtn">
          <i class="uil uil-qrcode-scan"></i>
          Patient Card
        </button>
        <button class="book-btn" id="bookConsultationBtn">
          <i class="uil uil-calendar-plus"></i>
          <span data-i18n="bookConsultation">Book Consultation</span>
        </button>
        <div class="stat-card">
          <span class="stat-value" id="upcomingVisit">—</span>
          <span class="stat-label" data-i18n="upcomingConsultation">Upcoming Consultation</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="lastVisit">—</span>
          <span class="stat-label" data-i18n="lastVisit">Last Visit</span>
        </div>
      </div>
    </section>

    <div class="main-grid">
      <!-- Row 1 -->
      <section class="col-8">
        <div class="card consultation-overview">
          <div class="card-header">
            <h2 data-i18n="lastConsultation">Last Consultation</h2>
            <div class="header-actions">
              <button class="audio-btn" id="viewTranscriptBtn"><i class="uil uil-file-alt"></i> <span data-i18n="viewTranscript">View Transcript</span></button>
            </div>
          </div>
          <div class="card-body">
            <div id="lastConsultationCard">
              <!-- Last consultation loaded via JS -->
            </div>
            <div class="dynamic-content consultation-overview-details" id="details-content">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </section>

      <section class="col-4">
        <div class="card actions-required">
          <div class="card-header recommendations-header">
            <h2><i class="uil uil-clipboard-notes"></i> <span data-i18n="actionsRequired">Actions Required</span></h2>
          </div>
          <div class="card-body" id="actionsRequiredList">
             <!-- Actions loaded via JS -->
          </div>
        </div>
      </section>

      <section class="col-12">
        <div class="card documents-files">
          <div class="card-header border-bottom">
            <h2 data-i18n="documentsFiles">Documents & Files</h2>
            <div class="docs-tabs">
              <button class="doc-tab active">All</button>
              <button class="doc-tab">Prescriptions</button>
              <button class="doc-tab">Reports</button>
              <button class="doc-tab">Lab Results</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="doc-list">
               <!-- Documents loaded via JS -->
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div class="modal-overlay hidden" id="bookingModal">
    <div class="modal-content booking-modal-content">
      <div class="modal-header">
        <div>
          <h3 data-i18n="bookConsultation">Book Consultation</h3>
          <p class="modal-subtitle" id="bookingStepLabel">Choose a specialty</p>
        </div>
        <button class="close-btn" id="closeBookingModalBtn"><i class="uil uil-times"></i></button>
      </div>
      <form class="booking-form" id="bookingForm">
        <div class="modal-body booking-step-body">
          <div class="booking-progress" id="bookingProgress"></div>
          <div id="bookingStepContent"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="action-btn" id="cancelBookingModalBtn">Cancel</button>
          <button type="button" class="action-btn" id="bookingBackBtn">Back</button>
          <button type="button" class="action-btn" id="autoAssignBtn">Next free doctor</button>
          <button type="button" class="action-btn primary" id="bookingNextBtn">Next</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay hidden" id="transcriptModal">
    <div class="modal-content wide-modal">
      <div class="modal-header">
        <h3>Consultation Transcript</h3>
        <button class="close-btn" id="closeTranscriptModalBtn"><i class="uil uil-times"></i></button>
      </div>
      <div class="modal-body transcript-body" id="transcriptContent"></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="patientCardModal">
    <div class="modal-content patient-card-modal">
      <div class="modal-header">
        <h3>Patient Card</h3>
        <button class="close-btn" id="closePatientCardModalBtn"><i class="uil uil-times"></i></button>
      </div>
      <div class="modal-body patient-card-body" id="patientCardContent"></div>
    </div>
  </div>
  
  <script type="module" src="/src/patient.js"></script>
</body>
</html>
