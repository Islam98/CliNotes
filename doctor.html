<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard - CliNotes</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/doctor.css" />
    
    <!-- QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  </head>
  <body class="dashboard-body">
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="logo">CliNotes</div>
      </div>
      <div class="top-bar-center">
        <div class="search-wrapper" id="searchWrapper">
          <i class="uil uil-search search-icon"></i>
          <input type="text" placeholder="Search patients by name..." class="search-input" id="patientSearchInput" autocomplete="off">
          <!-- Search Results Dropdown -->
          <div class="search-dropdown hidden" id="searchDropdown">
            <div class="search-results" id="searchResults">
              <!-- Dynamic results -->
            </div>
          </div>
        </div>
      </div>
      <div class="top-bar-right">
        <button class="icon-btn" aria-label="Notifications">
          <i class="uil uil-bell"></i>
          <span class="notification-badge"></span>
        </button>
        <div class="avatar">
          <img src="https://ui-avatars.com/api/?name=Dr.+Smith&background=2F6FED&color=fff&bold=true" alt="Doctor Avatar">
        </div>
      </div>
    </header>

    <!-- MAIN GRID CONTAINER -->
    <main class="dashboard-container">
      <div class="dashboard-grid">
        
        <!-- ROW 0: Quick Actions -->
        <div class="col-12 quick-actions-row">
          <button class="primary-btn prominent-start-btn" id="startConsultationBtn">
            <i class="uil uil-record-audio"></i> Start New Consultation
          </button>
        </div>

        <!-- ROW 1 -->
        <!-- Today's Schedule -->
        <div class="card schedule-card col-8">
          <div class="card-header">
            <h3>Today's Schedule</h3>
            <button class="text-btn">View All</button>
          </div>
          <div class="card-body list-body">
            <!-- Data will be loaded via JS -->
          </div>
        </div>

        <!-- Alerts -->
        <div class="card alerts-card col-4">
          <div class="card-header">
            <h3>Alerts</h3>
          </div>
          <div class="card-body list-body">
            <!-- Alerts data will be loaded via JS -->
          </div>
        </div>

        <!-- ROW 2: Draft Notes for Review (PRIMARY) -->
        <div class="card drafts-card col-12 primary-section">
          <div class="card-header">
            <h2>Draft Notes for Review</h2>
            <span class="badge count-badge">3 Pending</span>
          </div>
          <div class="card-body list-body">
            <!-- Drafts will be loaded via JS -->
          </div>
        </div>

        <!-- ROW 3 -->
        <!-- Recent Patients -->
        <div class="card recent-card col-8">
          <div class="card-header">
            <h3>Recent Patients</h3>
          </div>
          <div class="card-body list-body">
             <!-- Recent patients will be loaded via JS -->
          </div>
        </div>

        <!-- AI Summary Preview -->
        <div class="card summary-card col-4">
          <div class="card-header">
            <h3>AI Summary Preview</h3>
          </div>
          <div class="card-body">
             <!-- AI Summary will be loaded via JS -->
          </div>
        </div>

        <!-- ROW 4 -->
        <!-- Session History -->
        <div class="card history-card col-12">
          <div class="card-header">
            <h3>Session History</h3>
          </div>
          <div class="card-body list-body">
            <!-- Session History will be loaded via JS -->
          </div>
        </div>
      </div>
    </main>

    <!-- SMART MOMENT CAPTURE FAB -->
    <button class="fab-capture" id="momentCaptureBtn" aria-label="Capture Moment">
      <i class="uil uil-waveform"></i>
    </button>
    
    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="captureToast">
      <span>Moment captured</span>
      <button class="undo-btn">Undo</button>
    </div>

    <!-- PATIENT SELECTION MODAL -->
    <div id="patientSelectionModal" class="modal-overlay hidden">
      <div class="modal-content" id="patientModalContent" style="transition: background-color 0.3s ease;">
        <div class="modal-header">
          <h3>Scan Patient Card</h3>
          <button class="close-btn" id="closePatientModalBtn"><i class="uil uil-times"></i></button>
        </div>
        <div class="modal-body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px;">
          <!-- QR Scanner Container -->
          <div id="qr-reader" style="width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; margin-bottom: 16px;"></div>
          
          <!-- Manual Patient ID Input for Testing -->
          <div id="manual-patient-entry" style="width: 100%; max-width: 400px; margin-bottom: 16px; text-align: center;">
            <p style="margin-bottom: 8px; font-size: 14px; color: #64748b;">Or enter Patient ID manually (Testing):</p>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="manualPatientIdInput" placeholder="Enter UUID (e.g. 99999999-...)" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;" />
              <button id="manualPatientSubmitBtn" class="primary-btn" style="padding: 10px 16px; font-size: 14px;">Confirm</button>
            </div>
          </div>

          <!-- Success State -->
          <div id="qr-success" class="hidden" style="text-align: center; padding: 24px;">
            <i class="uil uil-check-circle" style="font-size: 72px; color: #10B981;"></i>
            <h2 id="scannedPatientName" style="margin-top: 16px; color: #065F46; font-weight: 800; font-size: 24px;">Patient Identified</h2>
          </div>
        </div>
        <div class="modal-footer hidden" id="modalFooter" style="border-top: none;">
          <button class="primary-btn w-100" id="modalStartRecordBtn" style="background-color: #10B981;">Start Recording</button>
        </div>
      </div>
    </div>

    <!-- ACTIVE RECORDING OVERLAY -->
    <div id="recordingOverlay" class="recording-overlay hidden">
      <div class="recording-status">
        <div class="recording-indicator pulsing"></div>
        <span class="recording-time" id="recordingTimer">00:00</span>
      </div>
      <div class="recording-actions">
        <button class="record-action-btn highlight-btn" id="overlayHighlightBtn">
          <i class="uil uil-star"></i> Highlight Key Moment
        </button>
        <button class="record-action-btn note-btn" id="overlayNoteBtn">
          <i class="uil uil-edit"></i> Add Manual Note
        </button>
        <button class="record-action-btn stop-btn" id="overlayStopBtn">
          <i class="uil uil-stop-circle"></i> Stop Recording
        </button>
      </div>
    </div>

    <script type="module" src="/src/doctor.js"></script>
  </body>
</html>
