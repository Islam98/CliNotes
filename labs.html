<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labs - CliNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/labs.css">
</head>
<body class="labs-body">
  <header class="labs-topbar">
    <a href="/" class="labs-logo">CliNotes</a>
    <span class="labs-pill">Labs</span>
  </header>

  <main class="labs-container">
    <section class="labs-hero">
      <div>
        <h1>Internal Doctor Discussion</h1>
        <p>Record clinical discussions between doctors, transcribe them, and generate a reviewable report for every participant.</p>
      </div>
      <button class="start-discussion-btn" id="startDiscussionBtn">
        <i class="uil uil-microphone"></i>
        Start Labs Discussion
      </button>
    </section>

    <section class="labs-grid">
      <div class="labs-card participants-card">
        <div class="labs-card-header">
          <h2>Participating Doctors</h2>
          <span id="participantCount">0 added</span>
        </div>
        <div class="participants-window" id="participantsList">
          <p class="empty-copy">Add doctors using their CliNotes credentials.</p>
        </div>
      </div>

      <div class="labs-card add-doctor-card">
        <div class="labs-card-header">
          <h2>Add Doctor</h2>
        </div>
        <form id="addDoctorForm" class="doctor-credential-form">
          <label for="doctorEmail">Doctor email</label>
          <input id="doctorEmail" type="email" placeholder="doctor@example.com" required>

          <label for="doctorPassword">Password</label>
          <input id="doctorPassword" type="password" placeholder="Password" required>

          <button type="submit" class="secondary-action-btn">
            <i class="uil uil-user-plus"></i>
            Add to Discussion
          </button>
        </form>
      </div>
    </section>

    <section class="recording-panel hidden" id="recordingPanel">
      <div class="recording-state">
        <span class="recording-dot"></span>
        <strong id="recordingTimer">00:00</strong>
        <span id="recordingStatus">Recording discussion</span>
      </div>
      <button class="stop-discussion-btn" id="stopDiscussionBtn">
        <i class="uil uil-stop-circle"></i>
        Stop & Process
      </button>
    </section>
  </main>

  <div class="toast hidden" id="labsToast"></div>

  <script type="module" src="/src/labs.js"></script>
</body>
</html>
